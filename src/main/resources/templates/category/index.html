<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head('category.title')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0" th:text="#{category.title}">Dish categories</h3>
        <a class="btn btn-primary" th:href="@{/categories/create}" th:text="#{category.add}">+ Add category</a>
    </div>

    <div th:replace="~{fragments :: alerts}"></div>

    <table class="table table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>#</th>
            <th th:text="#{category.name}">Name</th>
            <th th:text="#{category.description}">Description</th>
            <th th:text="#{category.dishCount}">Dishes</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categories}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.description}"></td>
            <td th:text="${#lists.size(c.dishes)}"></td>
            <td class="text-nowrap">
                <a class="btn btn-sm btn-outline-warning" th:href="@{/categories/{id}/edit(id=${c.id})}" th:text="#{common.edit}">Edit</a>
                <form method="post" th:action="@{/categories/{id}/delete(id=${c.id})}" class="d-inline"
                      th:attr="data-confirm=#{category.confirmDelete}"
                      onsubmit="return confirm(this.dataset.confirm)">
                    <button class="btn btn-sm btn-outline-danger" th:text="#{common.delete}">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
