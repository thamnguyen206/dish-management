<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments :: head(${titleKey})}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<div class="container" style="max-width:640px">
    <h3 class="mb-3" th:text="#{${titleKey}}">Category</h3>

    <form method="post" th:action="@{${action}}" th:object="${categoryForm}" novalidate>
        <div class="mb-3">
            <label class="form-label" th:text="#{category.name}">Name</label>
            <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" th:text="#{category.description}">Description</label>
            <textarea th:field="*{description}" rows="3" class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <button class="btn btn-primary" type="submit" th:text="#{common.save}">Save</button>
        <a class="btn btn-outline-secondary" th:href="@{/categories}" th:text="#{common.cancel}">Cancel</a>
    </form>
</div>
</body>
</html>
