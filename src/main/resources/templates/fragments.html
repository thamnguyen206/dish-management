<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titleKey)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{${titleKey}} + ' - ' + #{app.title}">Dish Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dishes}" th:text="#{app.title}">Dish Management</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/dishes}" th:text="#{nav.dishes}">Dishes</a>
            <a class="nav-link" th:href="@{/categories}" th:text="#{nav.categories}">Categories</a>
        </div>
        <!-- Chuyển ngôn ngữ: link giữ nguyên điều kiện tìm kiếm/lọc/sắp xếp đang có trên URL -->
        <div class="navbar-nav">
            <span class="navbar-text me-2" th:text="#{lang.label}">Language</span>
            <a class="nav-link" th:classappend="${#locale.language == 'en'} ? 'active fw-bold'"
               th:href="${@langUrl.base() + 'en'}">English</a>
            <a class="nav-link" th:classappend="${#locale.language == 'vi'} ? 'active fw-bold'"
               th:href="${@langUrl.base() + 'vi'}">Tiếng Việt</a>
        </div>
    </div>
</nav>
<div th:fragment="alerts">
    <div class="alert alert-success" th:if="${successKey}" th:text="#{${successKey}}"></div>
    <div class="alert alert-danger" th:if="${errorKey}" th:text="#{${errorKey}(${errorArg})}"></div>
</div>
</body>
</html>
