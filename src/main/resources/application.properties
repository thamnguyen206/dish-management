server.port=8080

# SQL Server (Windows Authentication) - database theo quy tắc MSSV
spring.datasource.url=jdbc:sqlserver://LAPTOP-12OGD3V1;databaseName=BIT240269_MID;encrypt=true;trustServerCertificate=true;integratedSecurity=true

# Bảng tạo bằng script BIT240269_MID.sql, Hibernate không tự tạo/sửa bảng
spring.jpa.hibernate.ddl-auto=none
# GIỮ NGUYÊN tên cột như trong @Column (không đổi camelCase thành snake_case) -> cột đúng dạng BIT240269_Xxx
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

spring.thymeleaf.cache=false

# Đa ngôn ngữ: messages.properties (English, mặc định) + messages_vi.properties (Tiếng Việt)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Không lấy ngôn ngữ của hệ điều hành -> lần đầu truy cập luôn là English
spring.messages.fallback-to-system-locale=false
